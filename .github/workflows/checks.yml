name: CPU script checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n scripts/common.sh scripts/install.sh scripts/download.sh scripts/serve.sh scripts/smoke.sh
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
